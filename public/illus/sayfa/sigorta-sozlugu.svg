<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky-sz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5FAFD"/><stop offset="1" stop-color="#DCF0FB"/>
    </linearGradient>
    <linearGradient id="blue-sz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC4EC"/><stop offset=".55" stop-color="#1FA3D8"/><stop offset="1" stop-color="#0B7FBF"/>
    </linearGradient>
    <linearGradient id="navy-sz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1749A5"/><stop offset="1" stop-color="#0E2D6B"/>
    </linearGradient>
    <linearGradient id="arc-sz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC4EC" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5CC4EC" stop-opacity=".6"/>
      <stop offset="1" stop-color="#5CC4EC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-sz"><rect width="800" height="600" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame-sz)">
    <rect width="800" height="600" fill="url(#sky-sz)"/>
    <circle cx="648" cy="120" r="165" fill="#FFFFFF" opacity=".5"/>
    <circle cx="130" cy="470" r="120" fill="#D2EEFB" opacity=".55"/>

    <!-- bulutlar -->
    <g fill="#FFFFFF" opacity=".7">
      <ellipse cx="178" cy="166" rx="43" ry="24"/>
      <ellipse cx="214" cy="160" rx="31" ry="18"/>
    </g>

    <!-- koruma yayi -->
    <path d="M150 300 Q400 130 650 300" stroke="url(#arc-sz)" stroke-width="10" stroke-linecap="round"/>

    <!-- kitap kapagi -->
    <path d="M400 318 C352 296 292 290 248 296 C240 297 234 303 234 311 V452 C234 460 241 466 249 465 C292 460 352 464 400 486 C448 464 508 460 551 465 C559 466 566 460 566 452 V311 C566 303 560 297 552 296 C508 290 448 296 400 318 Z" fill="url(#navy-sz)"/>

    <!-- sayfalar -->
    <path d="M392 330 C348 310 294 305 254 310 V448 C294 443 348 448 392 468 Z" fill="#FFFFFF"/>
    <path d="M408 330 C452 310 506 305 546 310 V448 C506 443 452 448 408 468 Z" fill="#FFFFFF"/>

    <!-- sayfa satirlari -->
    <g stroke="#D2EEFB" stroke-width="9" stroke-linecap="round">
      <path d="M268 344 Q320 340 378 358"/>
      <path d="M268 372 Q320 368 378 386"/>
      <path d="M268 400 Q320 396 378 414"/>
      <path d="M268 428 Q314 424 356 438"/>
      <path d="M532 344 Q480 340 422 358"/>
      <path d="M532 372 Q480 368 422 386"/>
      <path d="M532 400 Q480 396 422 414"/>
      <path d="M532 428 Q486 424 444 438"/>
    </g>

    <!-- orta kivrim -->
    <path d="M400 324 V482" stroke="#0E2D6B" stroke-width="7" stroke-linecap="round" opacity=".25"/>

    <!-- buyutec -->
    <circle cx="556" cy="256" r="46" fill="#FFFFFF" opacity=".6"/>
    <circle cx="556" cy="256" r="46" stroke="url(#blue-sz)" stroke-width="14"/>
    <path d="M590 292 L628 330" stroke="#0E2D6B" stroke-width="16" stroke-linecap="round"/>
    <path d="M536 240 Q546 228 562 226" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".8"/>

    <!-- kucuk buz mavisi daireler -->
    <circle cx="200" cy="252" r="14" fill="#D2EEFB"/>
    <circle cx="656" cy="414" r="16" fill="#D2EEFB"/>
    <circle cx="164" cy="366" r="9" fill="#D2EEFB"/>
    <circle cx="628" cy="186" r="10" fill="#D2EEFB"/>

    <ellipse cx="400" cy="508" rx="268" ry="26" fill="#0E2D6B" opacity=".08"/>
  </g>
</svg>
