<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky-sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5FAFD"/><stop offset="1" stop-color="#DCF0FB"/>
    </linearGradient>
    <linearGradient id="blue-sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC4EC"/><stop offset=".55" stop-color="#1FA3D8"/><stop offset="1" stop-color="#0B7FBF"/>
    </linearGradient>
    <linearGradient id="navy-sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1749A5"/><stop offset="1" stop-color="#0E2D6B"/>
    </linearGradient>
    <linearGradient id="arc-sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC4EC" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5CC4EC" stop-opacity=".6"/>
      <stop offset="1" stop-color="#5CC4EC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-sg"><rect width="800" height="600" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame-sg)">
    <rect width="800" height="600" fill="url(#sky-sg)"/>
    <circle cx="648" cy="120" r="165" fill="#FFFFFF" opacity=".5"/>
    <circle cx="130" cy="470" r="120" fill="#D2EEFB" opacity=".55"/>

    <!-- bulutlar -->
    <g fill="#FFFFFF" opacity=".7">
      <ellipse cx="172" cy="178" rx="42" ry="24"/>
      <ellipse cx="208" cy="172" rx="30" ry="18"/>
      <ellipse cx="626" cy="246" rx="34" ry="19"/>
    </g>

    <!-- koruma yayi -->
    <path d="M150 300 Q400 130 650 300" stroke="url(#arc-sg)" stroke-width="10" stroke-linecap="round"/>

    <!-- 2x2 kart izgarasi -->
    <g fill="#FFFFFF" stroke="#0E2D6B" stroke-width="2.5" stroke-opacity=".14">
      <rect x="262" y="230" width="126" height="126" rx="24"/>
      <rect x="412" y="230" width="126" height="126" rx="24"/>
      <rect x="262" y="380" width="126" height="126" rx="24"/>
      <rect x="412" y="380" width="126" height="126" rx="24"/>
    </g>

    <!-- arac -->
    <path d="M303 286 L311 270 C313 266 316 264 320 264 L342 264 C347 264 350 267 352 271 L358 286 Z" fill="url(#navy-sg)"/>
    <rect x="289" y="284" width="72" height="26" rx="11" fill="url(#blue-sg)"/>
    <circle cx="306" cy="312" r="10" fill="#0E2D6B"/>
    <circle cx="344" cy="312" r="10" fill="#0E2D6B"/>

    <!-- kalp -->
    <path d="M475 325 C475 325 439 303 439 281 C439 270 448 262 458 262 C465 262 471 266 475 272 C479 266 485 262 492 262 C502 262 511 270 511 281 C511 303 475 325 475 325 Z" fill="url(#blue-sg)"/>

    <!-- ev -->
    <polygon points="325,410 363,441 287,441" fill="url(#navy-sg)"/>
    <rect x="293" y="439" width="64" height="36" rx="7" fill="url(#blue-sg)"/>
    <rect x="316" y="453" width="18" height="22" rx="5" fill="#FFFFFF" opacity=".92"/>

    <!-- ucak -->
    <path d="M475 407 C480 407 484 413 484 421 V433 L508 449 V457 L484 451 V465 L492 473 V479 L475 475 L458 479 V473 L466 465 V451 L442 457 V449 L466 433 V421 C466 413 470 407 475 407 Z" fill="url(#blue-sg)"/>

    <!-- izgara ustundeki kalkan rozeti -->
    <circle cx="400" cy="184" r="36" fill="#FFFFFF"/>
    <path d="M400 160 L421 168 V187 C421 200 412 209 400 213 C388 209 379 200 379 187 V168 Z" fill="url(#navy-sg)"/>
    <path d="M391 186 L397 192 L411 177" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- kucuk buz mavisi noktalar -->
    <circle cx="612" cy="400" r="14" fill="#D2EEFB"/>
    <circle cx="186" cy="310" r="10" fill="#D2EEFB"/>
    <circle cx="648" cy="470" r="9" fill="#D2EEFB"/>

    <ellipse cx="400" cy="508" rx="268" ry="26" fill="#0E2D6B" opacity=".08"/>
  </g>
</svg>
