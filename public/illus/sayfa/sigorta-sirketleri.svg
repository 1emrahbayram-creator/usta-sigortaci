<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky-sk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5FAFD"/><stop offset="1" stop-color="#DCF0FB"/>
    </linearGradient>
    <linearGradient id="blue-sk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC4EC"/><stop offset=".55" stop-color="#1FA3D8"/><stop offset="1" stop-color="#0B7FBF"/>
    </linearGradient>
    <linearGradient id="navy-sk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1749A5"/><stop offset="1" stop-color="#0E2D6B"/>
    </linearGradient>
    <linearGradient id="arc-sk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC4EC" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5CC4EC" stop-opacity=".6"/>
      <stop offset="1" stop-color="#5CC4EC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-sk"><rect width="800" height="600" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame-sk)">
    <rect width="800" height="600" fill="url(#sky-sk)"/>
    <circle cx="648" cy="120" r="165" fill="#FFFFFF" opacity=".5"/>
    <circle cx="124" cy="462" r="120" fill="#D2EEFB" opacity=".55"/>

    <!-- bulutlar -->
    <g fill="#FFFFFF" opacity=".7">
      <ellipse cx="166" cy="158" rx="44" ry="25"/>
      <ellipse cx="204" cy="152" rx="32" ry="19"/>
    </g>

    <!-- koruma yayi -->
    <path d="M150 300 Q400 130 650 300" stroke="url(#arc-sk)" stroke-width="10" stroke-linecap="round"/>

    <!-- yumusak hale -->
    <circle cx="400" cy="330" r="166" fill="#1FA3D8" opacity=".08"/>

    <!-- ustte kalkan amblemi -->
    <path d="M400 108 L452 128 V180 C452 214 430 238 400 250 C370 238 348 214 348 180 V128 Z" fill="url(#blue-sk)"/>
    <path d="M400 108 L400 250 C370 238 348 214 348 180 V128 Z" fill="#FFFFFF" opacity=".12"/>
    <path d="M382 176 L395 189 L420 162" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- anlasmali sirket kartlari -->
    <g fill="#FFFFFF" stroke="#0E2D6B" stroke-width="2.5" stroke-opacity=".12">
      <rect x="240" y="268" width="320" height="66" rx="22"/>
      <rect x="240" y="346" width="320" height="66" rx="22"/>
      <rect x="240" y="424" width="320" height="66" rx="22"/>
    </g>

    <!-- 1. kart: logo karesi, ad cubuklari, onay -->
    <rect x="264" y="281" width="40" height="40" rx="12" fill="url(#navy-sk)"/>
    <circle cx="284" cy="301" r="9" fill="#FFFFFF"/>
    <rect x="322" y="288" width="146" height="12" rx="6" fill="#5CC4EC"/>
    <rect x="322" y="308" width="102" height="10" rx="5" fill="#D2EEFB"/>
    <circle cx="520" cy="301" r="16" fill="#1FA3D8"/>
    <path d="M513 301 L518 306 L528 295" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 2. kart -->
    <rect x="264" y="359" width="40" height="40" rx="12" fill="url(#blue-sk)"/>
    <rect x="276" y="371" width="16" height="16" rx="5" fill="#FFFFFF"/>
    <rect x="322" y="366" width="124" height="12" rx="6" fill="#5CC4EC"/>
    <rect x="322" y="386" width="88" height="10" rx="5" fill="#D2EEFB"/>
    <circle cx="520" cy="379" r="16" fill="#1FA3D8"/>
    <path d="M513 379 L518 384 L528 373" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3. kart -->
    <rect x="264" y="437" width="40" height="40" rx="12" fill="url(#navy-sk)"/>
    <polygon points="284,448 295,467 273,467" fill="#FFFFFF"/>
    <rect x="322" y="444" width="158" height="12" rx="6" fill="#5CC4EC"/>
    <rect x="322" y="464" width="110" height="10" rx="5" fill="#D2EEFB"/>
    <circle cx="520" cy="457" r="16" fill="#1FA3D8"/>
    <path d="M513 457 L518 462 L528 451" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- kucuk buz mavisi noktalar -->
    <circle cx="674" cy="332" r="13" fill="#D2EEFB"/>
    <circle cx="140" cy="258" r="10" fill="#D2EEFB"/>
    <circle cx="640" cy="470" r="9" fill="#D2EEFB"/>

    <ellipse cx="400" cy="508" rx="244" ry="24" fill="#0E2D6B" opacity=".08"/>
  </g>
</svg>
