<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky-hsr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5FAFD"/><stop offset="1" stop-color="#DCF0FB"/>
    </linearGradient>
    <linearGradient id="blue-hsr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC4EC"/><stop offset=".55" stop-color="#1FA3D8"/><stop offset="1" stop-color="#0B7FBF"/>
    </linearGradient>
    <linearGradient id="navy-hsr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1749A5"/><stop offset="1" stop-color="#0E2D6B"/>
    </linearGradient>
    <linearGradient id="arc-hsr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC4EC" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5CC4EC" stop-opacity=".6"/>
      <stop offset="1" stop-color="#5CC4EC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-hsr"><rect width="800" height="600" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame-hsr)">
    <rect width="800" height="600" fill="url(#sky-hsr)"/>
    <circle cx="648" cy="120" r="165" fill="#FFFFFF" opacity=".5"/>
    <circle cx="130" cy="470" r="120" fill="#D2EEFB" opacity=".55"/>

    <!-- bulutlar -->
    <g fill="#FFFFFF" opacity=".75">
      <ellipse cx="186" cy="156" rx="45" ry="25"/>
      <ellipse cx="224" cy="150" rx="32" ry="19"/>
    </g>

    <!-- koruma yayı -->
    <path d="M150 300 Q400 130 650 300" stroke="url(#arc-hsr)" stroke-width="10" stroke-linecap="round"/>

    <!-- iletişim dalgaları (sol) -->
    <g stroke="#5CC4EC" stroke-linecap="round">
      <path d="M318 262 Q296 300 318 338" stroke-width="6" opacity=".7"/>
      <path d="M300 244 Q270 300 300 356" stroke-width="5" opacity=".5"/>
      <path d="M282 226 Q246 300 282 374" stroke-width="4" opacity=".35"/>
    </g>
    <!-- iletişim dalgaları (sağ) -->
    <g stroke="#5CC4EC" stroke-linecap="round">
      <path d="M482 262 Q504 300 482 338" stroke-width="6" opacity=".7"/>
      <path d="M500 244 Q530 300 500 356" stroke-width="5" opacity=".5"/>
      <path d="M518 226 Q554 300 518 374" stroke-width="4" opacity=".35"/>
    </g>

    <!-- zemin bandı -->
    <rect x="96" y="476" width="608" height="14" rx="7" fill="#D2EEFB"/>

    <!-- hasar dosyası / onaylı form (sol) -->
    <g>
      <rect x="150" y="342" width="108" height="128" rx="14" fill="url(#navy-hsr)"/>
      <rect x="162" y="356" width="84" height="100" rx="8" fill="#FFFFFF"/>
      <rect x="186" y="330" width="36" height="20" rx="7" fill="#0E2D6B"/>
      <rect x="194" y="322" width="20" height="12" rx="6" fill="#1FA3D8"/>
      <g fill="#1FA3D8">
        <rect x="174" y="370" width="58" height="8" rx="4" opacity=".55"/>
        <rect x="174" y="386" width="42" height="8" rx="4" opacity=".4"/>
      </g>
      <circle cx="204" cy="424" r="21" fill="url(#blue-hsr)"/>
      <path d="M194 424 L201 431 L215 416" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- saat kadranı (sağ) -->
    <g>
      <circle cx="630" cy="396" r="48" fill="url(#blue-hsr)"/>
      <circle cx="630" cy="396" r="37" fill="#FFFFFF"/>
      <path d="M630 396 V368" stroke="#0E2D6B" stroke-width="6" stroke-linecap="round"/>
      <path d="M630 396 L652 406" stroke="#0E2D6B" stroke-width="5" stroke-linecap="round"/>
      <circle cx="630" cy="396" r="4" fill="#0E2D6B"/>
      <g fill="#1FA3D8" opacity=".5">
        <circle cx="630" cy="368" r="3"/>
        <circle cx="658" cy="396" r="3"/>
        <circle cx="630" cy="424" r="3"/>
        <circle cx="602" cy="396" r="3"/>
      </g>
    </g>

    <!-- destek danışmanı -->
    <g>
      <path d="M400 352 C362 352 334 378 330 416 L322 466 C320 472 325 478 332 478 L468 478 C475 478 480 472 478 466 L470 416 C466 378 438 352 400 352 Z"
            fill="url(#navy-hsr)"/>
      <path d="M400 368 V478" stroke="#FFFFFF" stroke-width="3" opacity=".22" stroke-linecap="round"/>
      <rect x="382" y="398" width="36" height="26" rx="7" fill="#FFFFFF" opacity=".9"/>
      <circle cx="400" cy="296" r="46" fill="url(#blue-hsr)"/>
      <path d="M358 288 Q400 222 442 288" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <circle cx="356" cy="300" r="13" fill="#FFFFFF"/>
      <circle cx="444" cy="300" r="13" fill="#FFFFFF"/>
      <path d="M446 314 Q464 356 424 366" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <circle cx="419" cy="367" r="7" fill="#FFFFFF"/>
    </g>

    <!-- buz mavisi noktalar -->
    <g fill="#5CC4EC" opacity=".4">
      <circle cx="160" cy="258" r="9"/>
      <circle cx="694" cy="268" r="7"/>
    </g>

    <ellipse cx="400" cy="508" rx="268" ry="26" fill="#0E2D6B" opacity=".08"/>
  </g>
</svg>
