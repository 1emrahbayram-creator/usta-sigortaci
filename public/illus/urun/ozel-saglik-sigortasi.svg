<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky-os" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5FAFD"/><stop offset="1" stop-color="#DCF0FB"/>
    </linearGradient>
    <linearGradient id="blue-os" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC4EC"/><stop offset=".55" stop-color="#1FA3D8"/><stop offset="1" stop-color="#0B7FBF"/>
    </linearGradient>
    <linearGradient id="navy-os" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1749A5"/><stop offset="1" stop-color="#0E2D6B"/>
    </linearGradient>
    <linearGradient id="arc-os" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC4EC" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5CC4EC" stop-opacity=".6"/>
      <stop offset="1" stop-color="#5CC4EC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-os"><rect width="800" height="600" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame-os)">
    <rect width="800" height="600" fill="url(#sky-os)"/>
    <circle cx="648" cy="120" r="165" fill="#FFFFFF" opacity=".5"/>
    <circle cx="130" cy="470" r="120" fill="#D2EEFB" opacity=".55"/>

    <path d="M150 300 Q400 130 650 300" stroke="url(#arc-os)" stroke-width="10" stroke-linecap="round"/>

    <!-- kalbin arkasındaki soluk kalkan konturu -->
    <path d="M400 184 L580 248 V370 C580 448 506 498 400 522 C294 498 220 448 220 370 V248 Z" fill="#1FA3D8" opacity=".08"/>
    <path d="M400 184 L580 248 V370 C580 448 506 498 400 522 C294 498 220 448 220 370 V248 Z" stroke="#1FA3D8" stroke-width="4" opacity=".28"/>

    <!-- büyük kalp -->
    <path d="M400 486 C322 422 255 374 255 320 C255 277 288 246 329 246 C358 246 383 261 400 285 C417 261 442 246 471 246 C512 246 545 277 545 320 C545 374 478 422 400 486 Z" fill="url(#blue-os)"/>
    <!-- kalbin üst ışıklı yansıması -->
    <path d="M296 292 C304 274 318 264 336 264" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".45"/>

    <!-- nabız / EKG çizgisi -->
    <path d="M278 356 H336 L350 356 L363 316 L381 400 L397 334 L410 356 H522"
          stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- stetoskop -->
    <g stroke="#0E2D6B" stroke-linecap="round">
      <path d="M600 414 C596 364 620 336 652 326" stroke-width="10" opacity=".9"/>
      <path d="M652 326 C672 318 684 304 686 286" stroke-width="8" opacity=".9"/>
      <path d="M652 326 C660 344 672 354 690 358" stroke-width="8" opacity=".9"/>
    </g>
    <circle cx="686" cy="280" r="9" fill="#0E2D6B"/>
    <circle cx="694" cy="360" r="9" fill="#0E2D6B"/>
    <circle cx="600" cy="448" r="36" fill="url(#navy-os)"/>
    <circle cx="600" cy="448" r="18" fill="#ECF6FC"/>

    <!-- destek öğeleri -->
    <g fill="#FFFFFF" opacity=".75">
      <ellipse cx="190" cy="168" rx="44" ry="25"/>
      <ellipse cx="228" cy="162" rx="31" ry="18"/>
    </g>
    <g fill="#5CC4EC" opacity=".45">
      <circle cx="150" cy="332" r="9"/>
      <circle cx="178" cy="366" r="6"/>
      <circle cx="628" cy="208" r="8"/>
    </g>

    <ellipse cx="400" cy="508" rx="268" ry="26" fill="#0E2D6B" opacity=".08"/>
  </g>
</svg>
