<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky-tf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5FAFD"/><stop offset="1" stop-color="#DCF0FB"/>
    </linearGradient>
    <linearGradient id="blue-tf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC4EC"/><stop offset=".55" stop-color="#1FA3D8"/><stop offset="1" stop-color="#0B7FBF"/>
    </linearGradient>
    <linearGradient id="navy-tf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1749A5"/><stop offset="1" stop-color="#0E2D6B"/>
    </linearGradient>
    <linearGradient id="arc-tf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC4EC" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5CC4EC" stop-opacity=".6"/>
      <stop offset="1" stop-color="#5CC4EC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-tf"><rect width="800" height="600" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame-tf)">
    <rect width="800" height="600" fill="url(#sky-tf)"/>
    <circle cx="648" cy="120" r="165" fill="#FFFFFF" opacity=".5"/>
    <circle cx="130" cy="470" r="120" fill="#D2EEFB" opacity=".55"/>

    <!-- bulutlar -->
    <g fill="#FFFFFF" opacity=".75">
      <ellipse cx="236" cy="158" rx="46" ry="26"/>
      <ellipse cx="276" cy="152" rx="33" ry="19"/>
      <ellipse cx="566" cy="226" rx="36" ry="20"/>
      <ellipse cx="596" cy="222" rx="26" ry="15"/>
    </g>

    <!-- koruma yayı: araçların üstünden geçer -->
    <path d="M150 300 Q400 130 650 300" stroke="url(#arc-tf)" stroke-width="10" stroke-linecap="round"/>

    <!-- solda trafik lambası -->
    <g>
      <ellipse cx="112" cy="472" rx="28" ry="8" fill="#0E2D6B" opacity=".14"/>
      <rect x="104" y="352" width="16" height="120" rx="8" fill="url(#navy-tf)"/>
      <rect x="76" y="212" width="72" height="16" rx="8" fill="url(#navy-tf)"/>
      <rect x="82" y="224" width="60" height="136" rx="20" fill="url(#navy-tf)"/>
      <circle cx="112" cy="258" r="15" fill="#5CC4EC"/>
      <circle cx="112" cy="292" r="15" fill="#D2EEFB"/>
      <circle cx="112" cy="326" r="15" fill="#FFFFFF"/>
    </g>

    <!-- arka şerit -->
    <rect x="300" y="442" width="420" height="12" rx="6" fill="#D2EEFB" opacity=".85"/>
    <path d="M330 448 H386 M424 448 H480 M518 448 H574 M612 448 H668" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".85"/>
    <ellipse cx="572" cy="450" rx="150" ry="13" fill="#0E2D6B" opacity=".06"/>

    <!-- arkadaki lacivert araç (daha küçük, tam görünür) -->
    <g>
      <path d="M478 368 L504 330 C510 323 517 320 526 320 L608 320 C618 320 625 324 631 332 L656 368 Z" fill="url(#navy-tf)"/>
      <rect x="436" y="362" width="272" height="62" rx="20" fill="url(#navy-tf)"/>
      <rect x="440" y="406" width="264" height="18" rx="9" fill="#0E2D6B" opacity=".18"/>
      <rect x="514" y="332" width="40" height="28" rx="7" fill="#FFFFFF" opacity=".8"/>
      <rect x="564" y="332" width="42" height="28" rx="7" fill="#FFFFFF" opacity=".8"/>
      <path d="M560 370 V404" stroke="#FFFFFF" stroke-width="3" opacity=".22" stroke-linecap="round"/>
      <rect x="686" y="382" width="18" height="13" rx="6" fill="#FFFFFF" opacity=".9"/>
      <circle cx="498" cy="424" r="25" fill="#0E2D6B"/>
      <circle cx="498" cy="424" r="10" fill="#ECF6FC"/>
      <circle cx="656" cy="424" r="25" fill="#0E2D6B"/>
      <circle cx="656" cy="424" r="10" fill="#ECF6FC"/>
    </g>

    <!-- ön şerit -->
    <rect x="96" y="484" width="608" height="16" rx="8" fill="#D2EEFB"/>
    <path d="M150 492 H240 M290 492 H380 M430 492 H520 M570 492 H650" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".9"/>

    <!-- öndeki mavi araç -->
    <g>
      <path d="M218 388 L248 342 C254 334 263 330 273 330 L362 330 C373 330 382 335 388 344 L416 388 Z" fill="url(#blue-tf)"/>
      <rect x="170" y="382" width="296" height="72" rx="24" fill="url(#blue-tf)"/>
      <rect x="174" y="432" width="288" height="20" rx="10" fill="#0E2D6B" opacity=".12"/>
      <rect x="260" y="342" width="44" height="32" rx="8" fill="#FFFFFF" opacity=".95"/>
      <rect x="314" y="342" width="48" height="32" rx="8" fill="#FFFFFF" opacity=".95"/>
      <path d="M312 390 V430" stroke="#0E2D6B" stroke-width="3" opacity=".18" stroke-linecap="round"/>
      <rect x="444" y="398" width="20" height="15" rx="7" fill="#FFFFFF" opacity=".95"/>
      <rect x="172" y="398" width="16" height="15" rx="7" fill="#0E2D6B" opacity=".3"/>
      <circle cx="228" cy="452" r="34" fill="url(#navy-tf)"/>
      <circle cx="228" cy="452" r="14" fill="#ECF6FC"/>
      <circle cx="408" cy="452" r="34" fill="url(#navy-tf)"/>
      <circle cx="408" cy="452" r="14" fill="#ECF6FC"/>
    </g>

    <ellipse cx="400" cy="508" rx="268" ry="26" fill="#0E2D6B" opacity=".08"/>
  </g>
</svg>
