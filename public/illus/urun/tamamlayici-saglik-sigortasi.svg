<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky-ts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5FAFD"/><stop offset="1" stop-color="#DCF0FB"/>
    </linearGradient>
    <linearGradient id="blue-ts" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC4EC"/><stop offset=".55" stop-color="#1FA3D8"/><stop offset="1" stop-color="#0B7FBF"/>
    </linearGradient>
    <linearGradient id="navy-ts" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1749A5"/><stop offset="1" stop-color="#0E2D6B"/>
    </linearGradient>
    <linearGradient id="arc-ts" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC4EC" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5CC4EC" stop-opacity=".6"/>
      <stop offset="1" stop-color="#5CC4EC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-ts"><rect width="800" height="600" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame-ts)">
    <rect width="800" height="600" fill="url(#sky-ts)"/>
    <circle cx="648" cy="120" r="165" fill="#FFFFFF" opacity=".5"/>
    <circle cx="130" cy="470" r="120" fill="#D2EEFB" opacity=".55"/>

    <path d="M150 300 Q400 130 650 300" stroke="url(#arc-ts)" stroke-width="10" stroke-linecap="round"/>

    <!-- solda küçük devlet hastanesi (SGK payı) -->
    <g>
      <rect x="170" y="356" width="138" height="132" rx="14" fill="#5CC4EC" opacity=".85"/>
      <rect x="160" y="338" width="158" height="22" rx="11" fill="#0B7FBF" opacity=".9"/>
      <g fill="#FFFFFF" opacity=".95">
        <rect x="192" y="302" width="18" height="48" rx="6"/>
        <rect x="177" y="317" width="48" height="18" rx="6"/>
      </g>
      <g fill="#FFFFFF" opacity=".92">
        <rect x="190" y="378" width="32" height="28" rx="7"/>
        <rect x="236" y="378" width="32" height="28" rx="7"/>
        <rect x="190" y="420" width="32" height="28" rx="7"/>
      </g>
      <path d="M238 488 V450 C238 439 247 430 258 430 C269 430 278 439 278 450 V488 Z" fill="#ECF6FC"/>
    </g>

    <!-- sağda büyük özel hastane -->
    <g>
      <!-- çatıda mavi artı -->
      <rect x="520" y="166" width="28" height="74" rx="9" fill="url(#blue-ts)"/>
      <rect x="497" y="189" width="74" height="28" rx="9" fill="url(#blue-ts)"/>
      <rect x="416" y="238" width="236" height="24" rx="11" fill="url(#blue-ts)"/>
      <rect x="430" y="256" width="208" height="232" rx="16" fill="url(#navy-ts)"/>
      <g fill="#FFFFFF" opacity=".9">
        <rect x="452" y="286" width="40" height="32" rx="7"/>
        <rect x="504" y="286" width="40" height="32" rx="7"/>
        <rect x="556" y="286" width="40" height="32" rx="7"/>
        <rect x="452" y="336" width="40" height="32" rx="7"/>
        <rect x="556" y="336" width="40" height="32" rx="7"/>
        <rect x="452" y="386" width="40" height="32" rx="7"/>
        <rect x="504" y="386" width="40" height="32" rx="7"/>
        <rect x="556" y="386" width="40" height="32" rx="7"/>
      </g>
      <rect x="504" y="336" width="40" height="32" rx="7" fill="#5CC4EC"/>
      <path d="M498 488 V442 C498 428 509 418 524 418 L544 418 C559 418 570 428 570 442 V488 Z" fill="#ECF6FC"/>
    </g>

    <!-- iki kurumu birleştiren bağ + tamamlayıcı artı rozeti -->
    <path d="M308 408 H392" stroke="#1FA3D8" stroke-width="9" stroke-linecap="round" opacity=".45"/>
    <g>
      <circle cx="402" cy="408" r="54" fill="#FFFFFF"/>
      <circle cx="402" cy="408" r="44" fill="url(#blue-ts)"/>
      <g fill="#FFFFFF">
        <rect x="392" y="382" width="20" height="52" rx="7"/>
        <rect x="376" y="398" width="52" height="20" rx="7"/>
      </g>
    </g>

    <!-- zemin -->
    <rect x="96" y="488" width="608" height="14" rx="7" fill="#D2EEFB"/>

    <!-- destek öğeleri -->
    <g fill="#FFFFFF" opacity=".75">
      <ellipse cx="200" cy="176" rx="44" ry="25"/>
      <ellipse cx="238" cy="170" rx="31" ry="18"/>
    </g>
    <g fill="#5CC4EC" opacity=".45">
      <circle cx="140" cy="300" r="9"/>
      <circle cx="168" cy="330" r="6"/>
      <circle cx="692" cy="330" r="9"/>
      <circle cx="668" cy="362" r="6"/>
    </g>

    <ellipse cx="400" cy="508" rx="268" ry="26" fill="#0E2D6B" opacity=".08"/>
  </g>
</svg>
