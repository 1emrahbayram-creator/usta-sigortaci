<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky-fk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5FAFD"/><stop offset="1" stop-color="#DCF0FB"/>
    </linearGradient>
    <linearGradient id="blue-fk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC4EC"/><stop offset=".55" stop-color="#1FA3D8"/><stop offset="1" stop-color="#0B7FBF"/>
    </linearGradient>
    <linearGradient id="navy-fk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1749A5"/><stop offset="1" stop-color="#0E2D6B"/>
    </linearGradient>
    <linearGradient id="arc-fk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC4EC" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5CC4EC" stop-opacity=".6"/>
      <stop offset="1" stop-color="#5CC4EC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-fk"><rect width="800" height="600" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame-fk)">
    <rect width="800" height="600" fill="url(#sky-fk)"/>
    <circle cx="648" cy="120" r="165" fill="#FFFFFF" opacity=".5"/>
    <circle cx="130" cy="470" r="120" fill="#D2EEFB" opacity=".55"/>

    <!-- bulutlar -->
    <g fill="#FFFFFF" opacity=".75">
      <ellipse cx="180" cy="162" rx="45" ry="25"/>
      <ellipse cx="218" cy="156" rx="33" ry="19"/>
    </g>

    <!-- koruma yayı -->
    <path d="M150 300 Q400 130 650 300" stroke="url(#arc-fk)" stroke-width="10" stroke-linecap="round"/>

    <!-- zemin -->
    <rect x="96" y="486" width="608" height="14" rx="7" fill="#D2EEFB"/>

    <!-- insan büstü: omuzlu gövde + kafa (boyun yok, satranç piyonu görüntüsü olmasın) -->
    <path d="M286 492 Q272 492 272 478 V392 C272 364 308 342 352 342 C396 342 432 364 432 392 V478 Q432 492 418 492 Z"
          fill="url(#navy-fk)"/>
    <path d="M272 468 H432 V478 Q432 492 418 492 H286 Q272 492 272 478 Z" fill="#0E2D6B" opacity=".14"/>
    <circle cx="352" cy="290" r="52" fill="url(#blue-fk)"/>
    <circle cx="332" cy="270" r="17" fill="#FFFFFF" opacity=".18"/>

    <!-- yara bandı rozeti (omzun sağ altında) -->
    <circle cx="470" cy="424" r="66" fill="#FFFFFF" opacity=".95"/>
    <circle cx="470" cy="424" r="58" fill="url(#blue-fk)"/>
    <circle cx="470" cy="424" r="47" stroke="#FFFFFF" stroke-width="3" opacity=".3"/>
    <g transform="translate(470 424) rotate(-38)">
      <rect x="-42" y="-14" width="84" height="28" rx="14" fill="#FFFFFF"/>
      <rect x="-16" y="-14" width="32" height="28" rx="7" fill="#ECF6FC"/>
      <g fill="#0E2D6B" opacity=".22">
        <circle cx="-8" cy="-6" r="2.4"/><circle cx="0" cy="-6" r="2.4"/><circle cx="8" cy="-6" r="2.4"/>
        <circle cx="-8" cy="6" r="2.4"/><circle cx="0" cy="6" r="2.4"/><circle cx="8" cy="6" r="2.4"/>
      </g>
      <rect x="-42" y="6" width="84" height="8" rx="4" fill="#0E2D6B" opacity=".07"/>
    </g>

    <!-- koruma parıltıları -->
    <g stroke="#5CC4EC" stroke-width="7" stroke-linecap="round" opacity=".4">
      <path d="M152 366 H212"/>
      <path d="M176 414 H222"/>
    </g>

    <!-- buz mavisi noktalar -->
    <g fill="#5CC4EC" opacity=".4">
      <circle cx="300" cy="172" r="10"/>
      <circle cx="704" cy="298" r="11"/>
      <circle cx="104" cy="266" r="8"/>
      <circle cx="628" cy="462" r="9"/>
    </g>

    <ellipse cx="400" cy="508" rx="268" ry="26" fill="#0E2D6B" opacity=".08"/>
  </g>
</svg>
