<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky-iy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5FAFD"/><stop offset="1" stop-color="#DCF0FB"/>
    </linearGradient>
    <linearGradient id="blue-iy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC4EC"/><stop offset=".55" stop-color="#1FA3D8"/><stop offset="1" stop-color="#0B7FBF"/>
    </linearGradient>
    <linearGradient id="navy-iy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1749A5"/><stop offset="1" stop-color="#0E2D6B"/>
    </linearGradient>
    <linearGradient id="arc-iy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CC4EC" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5CC4EC" stop-opacity=".6"/>
      <stop offset="1" stop-color="#5CC4EC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-iy"><rect width="800" height="600" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame-iy)">
    <rect width="800" height="600" fill="url(#sky-iy)"/>
    <circle cx="648" cy="120" r="165" fill="#FFFFFF" opacity=".5"/>
    <circle cx="130" cy="470" r="120" fill="#D2EEFB" opacity=".55"/>

    <!-- bulutlar -->
    <g fill="#FFFFFF" opacity=".75">
      <ellipse cx="186" cy="166" rx="44" ry="25"/>
      <ellipse cx="224" cy="160" rx="32" ry="19"/>
    </g>

    <!-- komşu binalar -->
    <rect x="166" y="336" width="78" height="156" rx="12" fill="#D2EEFB"/>
    <rect x="662" y="352" width="64" height="140" rx="12" fill="#D2EEFB"/>

    <!-- koruma yayı -->
    <path d="M150 300 Q400 130 650 300" stroke="url(#arc-iy)" stroke-width="10" stroke-linecap="round"/>

    <!-- dükkan gövdesi -->
    <rect x="262" y="268" width="276" height="224" rx="16" fill="url(#navy-iy)"/>

    <!-- vitrin camı -->
    <rect x="286" y="312" width="152" height="128" rx="12" fill="#FFFFFF"/>
    <rect x="298" y="348" width="128" height="9" rx="4.5" fill="#D2EEFB"/>
    <rect x="298" y="392" width="128" height="9" rx="4.5" fill="#D2EEFB"/>

    <!-- kapı -->
    <rect x="460" y="338" width="62" height="154" rx="12" fill="url(#blue-iy)"/>
    <rect x="470" y="350" width="42" height="48" rx="8" fill="#FFFFFF" opacity=".85"/>
    <circle cx="470" cy="420" r="5" fill="#FFFFFF" opacity=".9"/>

    <!-- tente üst bandı -->
    <rect x="240" y="228" width="320" height="20" rx="10" fill="url(#navy-iy)"/>
    <!-- şeritli tente -->
    <g>
      <rect x="244" y="246" width="44" height="42" rx="6" fill="#FFFFFF"/>
      <rect x="288" y="246" width="44" height="42" rx="6" fill="#1FA3D8"/>
      <rect x="332" y="246" width="44" height="42" rx="6" fill="#FFFFFF"/>
      <rect x="376" y="246" width="44" height="42" rx="6" fill="#1FA3D8"/>
      <rect x="420" y="246" width="44" height="42" rx="6" fill="#FFFFFF"/>
      <rect x="464" y="246" width="44" height="42" rx="6" fill="#1FA3D8"/>
      <rect x="508" y="246" width="44" height="42" rx="6" fill="#FFFFFF"/>
    </g>
    <rect x="244" y="282" width="308" height="8" rx="4" fill="#0E2D6B" opacity=".12"/>

    <!-- tabela direği -->
    <rect x="606" y="398" width="10" height="94" rx="5" fill="#0B7FBF" opacity=".38"/>
    <rect x="574" y="352" width="76" height="50" rx="12" fill="#FFFFFF"/>
    <rect x="586" y="366" width="52" height="9" rx="4.5" fill="url(#blue-iy)"/>
    <rect x="586" y="382" width="34" height="8" rx="4" fill="#D2EEFB"/>

    <!-- zemin çizgisi -->
    <rect x="96" y="490" width="608" height="14" rx="7" fill="#D2EEFB"/>

    <ellipse cx="400" cy="508" rx="268" ry="26" fill="#0E2D6B" opacity=".08"/>
  </g>
</svg>
