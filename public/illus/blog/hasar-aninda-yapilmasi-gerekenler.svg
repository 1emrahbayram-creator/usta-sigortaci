      <path d="M234 428 L570 428 L570 440 C570 448 565 453 557 453 L247 453 C239 453 234 448 234 440 Z" fill="#0E2D6B" opacity=".14"/>
      <path d="M374 330 L398 330 C402 330 404 332 404 336 L404 362 L346 362 Z" fill="#FFFFFF" opacity=".95"/>
      <path d="M418 330 L466 330 C472 330 477 332 481 337 L501 362 L418 362 C415 362 414 360 414 357 L414 334 C414 331 415 330 418 330 Z" fill="#FFFFFF" opacity=".95"/>
      <circle cx="306" cy="452" r="42" fill="url(#navy-hyg)"/>
      <circle cx="306" cy="452" r="18" fill="#ECF6FC"/>
      <circle cx="506" cy="452" r="42" fill="url(#navy-hyg)"/>
      <circle cx="506" cy="452" r="18" fill="#ECF6FC"/>
    </g>

    <!-- lacivert araç (sola bakıyor) -->
    <g transform="translate(518 266) scale(-.45 .45)">
      <path d="M232 440 L232 404 C232 394 238 386 248 383 L318 364 L362 318 C370 309 381 304 393 304 L470 304 C483 304 495 310 503 320 L540 366 L556 371 C566 374 572 383 572 393 L572 440 C572 448 566 454 558 454 L246 454 C238 454 232 448 232 440 Z"
            fill="url(#navy-hyg)"/>
      <path d="M234 428 L570 428 L570 440 C570 448 565 453 557 453 L247 453 C239 453 234 448 234 440 Z" fill="#0E2D6B" opacity=".25"/>
      <path d="M374 330 L398 330 C402 330 404 332 404 336 L404 362 L346 362 Z" fill="#ECF6FC" opacity=".9"/>
      <path d="M418 330 L466 330 C472 330 477 332 481 337 L501 362 L418 362 C415 362 414 360 414 357 L414 334 C414 331 415 330 418 330 Z" fill="#ECF6FC" opacity=".9"/>
      <circle cx="306" cy="452" r="42" fill="#0E2D6B"/>
      <circle cx="306" cy="452" r="18" fill="#ECF6FC"/>
      <circle cx="506" cy="452" r="42" fill="#0E2D6B"/>
      <circle cx="506" cy="452" r="18" fill="#ECF6FC"/>
    </g>

    <!-- tutanak kartı -->
    <rect x="440" y="280" width="168" height="196" rx="18" fill="#FFFFFF"/>
    <rect x="440" y="280" width="168" height="196" rx="18" stroke="#0E2D6B" stroke-width="2" opacity=".12"/>
    <rect x="462" y="306" width="78" height="16" rx="8" fill="url(#navy-hyg)"/>
    <rect x="462" y="346" width="124" height="12" rx="6" fill="#D2EEFB"/>
    <rect x="462" y="380" width="124" height="12" rx="6" fill="#D2EEFB"/>
    <rect x="462" y="414" width="92" height="12" rx="6" fill="#D2EEFB"/>

    <!-- mavi kalem -->
    <g transform="rotate(26 556 388)">
      <rect x="544" y="330" width="24" height="116" rx="10" fill="url(#blue-hyg)"/>
      <rect x="544" y="330" width="24" height="18" rx="9" fill="#0E2D6B" opacity=".32"/>
      <rect x="544" y="418" width="24" height="12" rx="6" fill="#FFFFFF" opacity=".6"/>
      <path d="M544 444 H568 L560 466 C558 470 554 470 552 466 Z" fill="#0E2D6B"/>
    </g>

    <ellipse cx="400" cy="508" rx="268" ry="26" fill="#0E2D6B" opacity=".08"/>
  </g>
</svg>
